<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYLIGHT V31.3 AUTO-STOP</title>
<style>
:root{--gold:#FFD700;--bg:#0a0f1e;--card:#111a33;--green:#00ff88;--red:#ff4444;}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg);color:#fff;padding-bottom:80px}
.header{background:linear-gradient(135deg,#0f1b3d,#1a2a5a);padding:15px;text-align:center;position:sticky;top:0;z-index:10;border-bottom:2px solid var(--gold)}
.header h1{color:var(--gold);font-size:18px}
.header p{font-size:10px;opacity:0.8}
.stats{display:flex;gap:6px;padding:10px;flex-wrap:wrap}
.stat-card{flex:1;min-width:80px;background:var(--card);padding:8px;border-radius:10px;text-align:center;border:1px solid #223366}
.stat-card h4{font-size:9px;opacity:0.7}
.stat-card p{font-size:13px;font-weight:bold;color:var(--gold);margin-top:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.card{background:var(--card);border-radius:14px;padding:10px;border:1px solid #223366;position:relative}
.badge{position:absolute;top:6px;left:6px;background:var(--green);color:#000;font-size:9px;padding:2px 6px;border-radius:10px;font-weight:bold}
.badge.vip{background:var(--gold)}
.card h3{font-size:12px;margin-top:18px}
.price{color:var(--gold);font-weight:bold;font-size:13px}
.daily{color:var(--green);font-size:10px}
.expiry-box{margin-top:5px;background:#0a0f1e;border-radius:6px;padding:5px;font-size:9px;border:1px dashed #334}
.expiry-box .row{display:flex;justify-content:space-between;margin:2px 0}
.buy-btn{width:100%;margin-top:6px;padding:7px;background:var(--gold);color:#000;border:none;border-radius:15px;font-weight:bold;font-size:10px;cursor:pointer}
.progress{height:5px;background:#1a274f;border-radius:10px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width 0.3s}
.my-machine{background:var(--card);border-radius:10px;padding:10px;margin-bottom:8px;border-left:3px solid var(--gold)}
.my-machine.expiring{border-left-color:var(--red);background:#1a1020}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0d1530;display:flex;justify-content:space-around;padding:6px 0;border-top:1px solid #223366}
.nav-item{text-align:center;font-size:8px;color:#888}
.nav-item.active{color:var(--gold)}
.nav-item div{font-size:16px}
</style>
</head>
<body>
<div class="header">
<h1>💡 SKYLIGHT UGANDA V31.3 SAFE</h1>
<p>V31.3: Expiry Countdown + AUTO-STOP Profit • 30D (A) / 20D (VIP) • Secured</p>
</div>

<div class="stats">
<div class="stat-card"><h4>CAPITAL</h4><p id="capital">0 UGX</p></div>
<div class="stat-card"><h4>PROFIT</h4><p id="profit">0 UGX</p></div>
<div class="stat-card"><h4>INVESTED</h4><p id="invested">0 UGX</p></div>
<div class="stat-card"><h4>TOTAL EARNED</h4><p id="totalEarned">0 UGX</p></div>
</div><div class="grid" id="shop"></div>

<div style="padding:10px">
<h3 style="color:var(--gold);font-size:13px;margin:8px 0">📦 My Machines - Auto-Stop After Expiry</h3>
<div id="myMachines"></div>
<button onclick="simulateExpiryTest()" style="width:100%;padding:10px;background:#334;color:#fff;border:none;border-radius:10px;margin-top:10px;font-size:11px">🧪 TEST: Add Expired Machine (32 days old) to see Auto-Stop</button>
</div>

<div class="bottom-nav">
<div class="nav-item active"><div>🏠</div>HOME</div>
<div class="nav-item"><div>💬</div>CHAT</div>
<div class="nav-item"><div>📊</div>GRAPH</div>
<div class="nav-item"><div>🏆</div>REWARDS</div>
<div class="nav-item"><div>💵</div>WITHDRAW</div>
<div class="nav-item"><div>👤</div>PROFILE</div>
</div>

<script>
const MACHINES = [
 {id:'A1',name:'A-MACHINE 1',price:2000,daily:120,rate:6,days:30,type:'A'},
 {id:'A2',name:'A-MACHINE 2',price:5000,daily:300,rate:6,days:30,type:'A'},
 {id:'A3',name:'A-MACHINE 3',price:10000,daily:600,rate:6,days:30,type:'A'},
 {id:'A4',name:'A-MACHINE 4',price:20000,daily:1200,rate:6,days:30,type:'A'},
 {id:'VIP1',name:'VIP-MACHINE 1',price:50000,daily:5000,rate:10,days:20,type:'VIP'},
 {id:'VIP2',name:'VIP-MACHINE 2',price:100000,daily:10000,rate:10,days:20,type:'VIP'},
];
let state = JSON.parse(localStorage.getItem('skylight_v31_3')||'{"capital":25000,"profit":0,"invested":0,"purchases":[],"withdrawn":0}');

function save(){ localStorage.setItem('skylight_v31_3', JSON.stringify(state)); }

function calculateRealProfit(){
 const now=new Date();
 let totalEarned=0;
 state.purchases.forEach(p=>{
  const bought=new Date(p.boughtAt);
  const elapsedDays=Math.floor((now-bought)/(1000*60*60*24));
  const activeDays=Math.min(Math.max(0,elapsedDays), p.days);
  totalEarned+=p.daily*activeDays;
 });
 const realProfit=Math.max(0,totalEarned-(state.withdrawn||0));
 return {totalEarned,realProfit};
}function renderShop(){
 document.getElementById('shop').innerHTML=MACHINES.map(m=>`
  <div class="card">
   <div class="badge ${m.type==='VIP'?'vip':''}">${m.type==='VIP'?'VIP 10%':'A 6%'} • ${m.days}D</div>
   <h3>${m.name}</h3>
   <div class="price">${m.price.toLocaleString()} UGX</div>
   <div class="daily">${m.rate}% = ${m.daily.toLocaleString()}/day</div>
   <div class="expiry-box">
    <div class="row"><span>⏳ Duration:</span><span><b>${m.days} Days</b></span></div>
    <div class="row"><span>💰 Total:</span><span>${(m.daily*m.days).toLocaleString()} UGX</span></div>
    <div class="row"><span>🛑 Auto-Stop:</span><span>After ${m.days} Days</span></div>
   </div>
   <button class="buy-btn" onclick="buy('${m.id}')" ${state.capital < m.price ? 'disabled':''}>${state.capital < m.price ? 'Need Capital':'Buy • '+m.rate+'% • '+m.days+'D'}</button>
  </div>
 `).join('');
}

function renderMyMachines(){
 const now=new Date();
 const calc=calculateRealProfit();
 state.profit=calc.realProfit;
 document.getElementById('profit').textContent=state.profit.toLocaleString()+' UGX';
 document.getElementById('invested').textContent=state.invested.toLocaleString()+' UGX';
 document.getElementById('totalEarned').textContent=calc.totalEarned.toLocaleString()+' UGX';
 document.getElementById('capital').textContent=state.capital.toLocaleString()+' UGX';
 const list=document.getElementById('myMachines');
 if(state.purchases.length===0){ list.innerHTML='<p style="opacity:0.5;font-size:11px;text-align:center;padding:15px">No machines. Buy to see expiry + auto-stop!</p>'; return; }
 list.innerHTML=state.purchases.map(p=>{
  const bought=new Date(p.boughtAt);
  const expiry=new Date(bought); expiry.setDate(expiry.getDate()+p.days);
  const elapsed=Math.floor((now-bought)/(1000*60*60*24));
  const remaining=Math.max(0,p.days-elapsed);
  const pct=Math.min(100,Math.max(0,Math.floor((elapsed/p.days)*100)));
  const expired=remaining<=0;
  const warning=remaining<=3 && remaining>0;
  const activeDays=Math.min(elapsed,p.days);
  const earned=p.daily*activeDays;
  const maxReturn=p.daily*p.days;
  return `<div class="my-machine ${expired?'expiring':''}" style="${expired?'opacity:0.6':''}">
   <div style="display:flex;justify-content:space-between"><b style="font-size:12px">${p.name}</b><span style="font-size:9px;padding:2px 6px;border-radius:10px;background:${expired?'#ff4444':warning?'#ffaa00':'#00ff88'};color:#000;font-weight:bold">${expired?'EXPIRED 🛑':warning?remaining+'D LEFT 🔴':remaining+'D LEFT ✅'}</span></div>
   <div style="font-size:10px;margin:5px 0;line-height:1.5">
    <div style="display:flex;justify-content:space-between"><span>📅 Bought:</span><span>${bought.toLocaleDateString()}</span></div>
    <div style="display:flex;justify-content:space-between"><span>📅 Expires:</span><span style="${expired?'color:#ff4444;font-weight:bold':''}">${expiry.toLocaleDateString()} (${p.days}d)</span></div>
    <div style="display:flex;justify-content:space-between"><span>⏳ Day:</span><span>${activeDays}/${p.days}</span></div>
    <div style="display:flex;justify-content:space-between"><span>💵 Earned:</span><span>${earned.toLocaleString()} / ${maxReturn.toLocaleString()}</span></div>
    <div style="display:flex;justify-content:space-between"><span>Status:</span><span style="font-weight:bold;color:${expired?'#ff4444':'#00ff88'}">${expired?'STOPPED 🛑':warning?'ACTIVE ⚠️':'ACTIVE ✅'}</span></div>
   </div>
   <div class="progress"><div class="progress-fill" style="width:${pct}%;background:${expired?'#ff4444':''}"></div></div>
   ${expired?'<div style="font-size:10px;margin-top:5px;color:#ff4444;font-weight:bold">🛑 AUTO-STOPPED after '+p.days+' days. Max: '+maxReturn.toLocaleString()+' UGX reached. No more profit.</div>':''}
  </div>`;
 }).join('');
  }function buy(id){
 const m=MACHINES.find(x=>x.id===id);
 if(state.capital < m.price){ alert('❌ No CAPITAL'); return; }
 if(!confirm(`Buy ${m.name}?\nPrice: ${m.price}\n${m.days} Days\nDaily: ${m.daily}\nExpires: ${new Date(new Date().setDate(new Date().getDate()+m.days)).toLocaleDateString()}\nAuto-Stops after ${m.days}d\nTotal: ${(m.daily*m.days).toLocaleString()}`)) return;
 state.capital-=m.price; state.invested+=m.price;
 state.purchases.push({...m,boughtAt:new Date().toISOString()});
 render(); save();
 alert(`✅ Bought! Expires in ${m.days} days. Will AUTO-STOP!`);
}

function simulateExpiryTest(){
 const test={...MACHINES[0],boughtAt:new Date(new Date().setDate(new Date().getDate()-32)).toISOString()};
 state.purchases.push(test); state.invested+=test.price; render(); save();
}

function render(){ renderShop(); renderMyMachines(); save(); }
render();
setInterval(render,30000);
</script>
</body>
</html>
