<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skylight Uganda V31.2 SAFE - Original</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}body{background:radial-gradient(ellipse at top,#1f2937,#0b1220 60%,#070b14);color:#fff;padding-bottom:80px}.header{background:#1f2937;border-bottom:3px solid #facc15;padding:14px;text-align:center;position:sticky;top:0;z-index:100}.logo{width:52px;height:52px;background:linear-gradient(135deg,#facc15,#eab308);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto}.logo-text{color:#facc15;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.machine{background:linear-gradient(180deg,#1f2937,#111827);border:1px solid #333;border-radius:14px;overflow:hidden;position:relative}.machine.vip{border-color:#facc15}.badge{position:absolute;top:8px;left:8px;background:#22c55e;color:#fff;padding:3px 8px;border-radius:8px;font-size:9px;font-weight:900}.badge.vip{background:#facc15;color:#000}.machine img{width:100%;height:110px;object-fit:cover}.m-info{padding:10px}.m-price{color:#facc15;font-weight:900}.btn{width:100%;padding:12px;margin-top:8px;background:linear-gradient(135deg,#facc15,#eab308);border:none;border-radius:10px;font-weight:900;color:#000}#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#111827;color:#facc15;padding:12px 20px;border-radius:12px;border:2px solid #facc15;display:none;z-index:9999}.box{max-width:540px;margin:14px auto;padding:0 14px}.login-card{background:#1f2937;border:2px solid rgba(250,204,21,.2);border-radius:20px;padding:24px;margin:14px auto;max-width:540px}.input-group{background:#0f172a;border:1px solid #333;border-radius:12px;padding:4px 12px;margin:8px 0}.input-group input{background:transparent;border:none;color:#fff;width:100%;padding:12px;outline:none}.btn-gold{background:linear-gradient(135deg,#facc15,#eab308);color:#000;width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;margin-top:10px}.btn-dark{background:rgba(255,255,255,.06);color:#fff;border:1px solid #333;width:100%;padding:14px;border-radius:12px;margin-top:10px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111827;border-top:2px solid rgba(250,204,21,.2);display:flex;justify-content:space-around;padding:8px 0;z-index:100}.bottom-nav button{background:none;border:none;color:#9ca3af;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px}.bottom-nav button.active{color:#facc15}.bottom-nav button span{font-size:18px}</style>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,doc,setDoc,getDoc,getDocs,addDoc,updateDoc,query,where,orderBy,limit,serverTimestamp,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB48b63LjsJXEHLEn6pZu22L8R-Qs6nowk",authDomain:"skylight-ug.firebaseapp.com",projectId:"skylight-ug",storageBucket:"skylight-ug.firebasestorage.app",messagingSenderId:"264770229240",appId:"1:264770229240:web:53e256b75fba5036bf3c0d"};
const app=initializeApp(cfg);const db=getFirestore(app);
window.db=db;window.collection=collection;window.doc=doc;window.setDoc=setDoc;window.getDoc=getDoc;window.getDocs=getDocs;window.addDoc=addDoc;window.updateDoc=updateDoc;window.query=query;window.where=where;window.orderBy=orderBy;window.limit=limit;window.serverTimestamp=serverTimestamp;window.onSnapshot=onSnapshot;
</script></head><body>
<div id="toast"></div>
<div class="header"><div class="logo">💡</div><div class="logo-text">SKYLIGHT UGANDA V31.2 SAFE - ORIGINAL RESTORED</div><div style="font-size:10px;color:#9ca3af">V31.2 Original • No Expiry • Secured • Kampala</div><div class="nav" id="topNav" style="display:none;margin-top:10px"><button onclick="showTab('machines')" style="background:#facc15;color:#000;border:none;padding:8px 12px;border-radius:20px;font-size:11px;font-weight:700">MACHINES</button><button onclick="showTab('orders')" style="background:rgba(255,255,255,.06);color:#9ca3af;border:none;padding:8px 12px;border-radius:20px;font-size:11px">MY MACHINES</button></div></div>

<div id="authBox"><div id="loginBox" class="login-card" style="text-align:center"><div class="logo" style="width:80px;height:80px;font-size:38px">💡</div><h2 style="color:#fff;margin-top:14px">Welcome • V31.2 SAFE Original</h2><div style="margin-top:10px;text-align:left"><label style="font-size:11px;color:#9ca3af">Phone (07XXXXXXXX)</label><div class="input-group"><input id="loginPhoneField" type="tel" placeholder="07XXXXXXXX" value="07"></div><label style="font-size:11px;color:#9ca3af">Password</label><div class="input-group"><input id="loginPassField" type="password" placeholder="••••••••"></div><button class="btn-gold" onclick="doLogin()">Sign In • V31.2 SAFE Original ✅</button><button class="btn-dark" onclick="showRegister()">Create Account</button></div></div><div id="registerBox" class="login-card" style="display:none"><h2 style="color:#fff">Create Account • V31.2 Original</h2><div style="text-align:left;margin-top:12px"><label style="font-size:11px;color:#9ca3af">Name</label><div class="input-group"><input id="regName" placeholder="Your name"></div><label style="font-size:11px;color:#9ca3af">Phone 07XXXXXXXX</label><div class="input-group"><input id="regPhone" placeholder="07XXXXXXXX" value="07"></div><label style="font-size:11px;color:#9ca3af">Password Min 4 chars</label><div class="input-group"><input id="regPass" type="password" placeholder="Min 4 chars"></div><button class="btn-gold" onclick="registerReal()">Create Account • V31.2 Original</button><button class="btn-dark" onclick="showLogin()">Back to Login</button></div></div></div>

<div id="machinesTab" class="box" style="display:none"><div style="display:flex;gap:8px;margin-bottom:12px"><div style="flex:1;background:rgba(250,204,21,.15);border:1px solid rgba(250,204,21,.2);border-radius:12px;padding:10px;text-align:center"><div style="font-size:11px;color:#9ca3af">💼 CAPITAL</div><b id="balCapital" style="color:#facc15">0 UGX</b></div><div style="flex:1;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.2);border-radius:12px;padding:10px;text-align:center"><div style="font-size:11px;color:#9ca3af">💰 PROFIT</div><b id="balProfit" style="color:#fff">0 UGX</b><div id="dailyTotal" style="font-size:10px;color:#fff">+0 /day</div></div></div><div id="machineGrid" class="grid"></div></div>

<div id="ordersTab" class="box" style="display:none"><div style="background:#1f2937;border-radius:14px;padding:14px"><div style="font-weight:900;color:#facc15;margin-bottom:10px">📊 MY MACHINES - Original V31.2</div><div id="ordersList" style="font-size:11px">Loading...</div></div></div>

<div class="bottom-nav" id="bottomNav" style="display:none"><button onclick="showTab('machines')" id="b-machines" class="active"><span>⌂</span>HOME</button><button onclick="showTab('orders')" id="b-orders"><span>◫</span>MY MACHINES</button></div>

<script>
let currentUser=null,currentPhone=null,totalDailyCalc=0,totalInvestedCalc=0;
const IMG_A="https://i.ibb.co/NgJcMBYs/M1.jpg",IMG_M="https://i.ibb.co/nMFhSgZ7/M2.jpg",IMG_L="https://i.ibb.co/W4cgPCst/M3.jpg",IMG_U="https://i.ibb.co/JjzPSSsV/Sky-machine.jpg";
const machines=[];const config=[{c:'A',prices:[2000,5000,10000,20000,40000,80000],rate:0.06,img:IMG_A},{c:'M',prices:[3000,7000,15000,30000,60000,120000],rate:0.06,img:IMG_M},{c:'L',prices:[5000,10000,20000,40000,80000,150000],rate:0.06,img:IMG_L},{c:'U',prices:[8000,15000,30000,60000,120000,200000],rate:0.06,img:IMG_U},{c:'Y',prices:[12000,25000,50000,100000,200000,300000],rate:0.06,img:IMG_A},{c:'VIP',prices:[20000,40000,80000,150000,300000,500000],rate:0.10,img:IMG_U}];
config.forEach(cfg=>{cfg.prices.forEach((price,idx)=>{const daily=Math.round(price*cfg.rate);const level=idx+1;machines.push({id:`${cfg.c}-MACHINE ${level}`,cat:cfg.c,level,name:`${cfg.c}-MACHINE ${level}`,price,daily,rate:cfg.rate,img:cfg.img});});});
function cleanPhone(p){if(!p)return '';let c=(p+'').trim().replace(/\D/g,'');if(!c)return '';if(c.startsWith('256')){c='0'+c.slice(3);}if(c.length===9){c='0'+c;}return c;}
function showToast(msg){const t=document.getElementById('toast');t.innerText=msg;t.style.display='block';setTimeout(()=>t.style.display='none',4000);}
window.showTab=(t)=>{['machines','orders'].forEach(x=>{const el=document.getElementById(x+'Tab');if(el)el.style.display='none';});const target=document.getElementById(t+'Tab');if(target)target.style.display='block';};
function renderMachines(){const g=document.getElementById('machineGrid');if(!g)return;g.innerHTML=machines.map(m=>{const isVip=m.cat==='VIP';const rateTxt=isVip?'10%':'6%';return `<div class="machine ${isVip?'vip':''}"><div class="badge ${isVip?'vip':''}">${m.cat} • ${rateTxt}</div><img src="${m.img}" loading="lazy"><div class="m-info"><div style="font-weight:800;font-size:13px;color:#fff">${m.name}</div><div class="m-price">${m.price.toLocaleString()} UGX</div><div style="font-size:11px;color:${isVip?'#facc15':'#22c55e'}">${rateTxt} = ${m.daily.toLocaleString()} UGX/day</div><button class="btn" onclick="buyMachine('${m.id}',${m.price},${m.daily},${m.rate})">Buy with CAPITAL • ${rateTxt}</button></div></div>`;}).join('');}renderMachines();
window.buyMachine=async(id,price,daily,rate)=>{if(!currentUser){showToast('Login first');return;}const cap=currentUser.capital||0;if(cap<price){showToast('Need CAPITAL '+price.toLocaleString());return;}try{const uRef=doc(db,'users',cleanPhone(currentPhone));const snap=await getDoc(uRef);const curCap=snap.data().capital??0;if(curCap<price){showToast('Insufficient CAPITAL');return;}await updateDoc(uRef,{capital:curCap-price});currentUser.capital=curCap-price;await addDoc(collection(db,'orders'),{phone:cleanPhone(currentPhone),machineId:id,price,daily,rate:rate||0.06,status:'approved',time:serverTimestamp(),name:currentUser.name,paidWith:'CAPITAL'});showToast(id+' bought! Original V31.2');loadMyOrders();updateBal();}catch(e){showToast(e.message);}};
window.loadMyOrders=async()=>{if(!currentPhone)return;const q=query(collection(db,'orders'),where('phone','==',cleanPhone(currentPhone)));const snap=await getDocs(q);let html='';totalInvestedCalc=0;totalDailyCalc=0;snap.forEach(d=>{const o=d.data();if(o.status==='approved'){totalInvestedCalc+=o.price||0;const rate=o.rate||0.06;const daily6=o.daily||Math.round((o.price||0)*rate);totalDailyCalc+=daily6;const rateTxt=rate>=0.09?'10% VIP':'6%';html+=`<div style="border:1px solid #333;padding:10px;margin:6px 0;border-radius:12px;background:#111827"><b>${o.machineId} - ${o.price} UGX</b><br><span style="font-size:10px">${rateTxt} = ${daily6} UGX/day</span></div>`;}});document.getElementById('ordersList').innerHTML=html||'No orders';const dt=document.getElementById('dailyTotal');if(dt)dt.innerText='+'+totalDailyCalc+' /day';};
function updateBal(){const cap=currentUser?.capital||0;const prof=currentUser?.profit||0;const el1=document.getElementById('balCapital');if(el1)el1.innerText=cap.toLocaleString()+' UGX';const el2=document.getElementById('balProfit');if(el2)el2.innerText=prof.toLocaleString()+' UGX';}
window.doLogin=async()=>{let phoneRaw=document.getElementById('loginPhoneField')?.value||'';let phone=cleanPhone(phoneRaw);const pass=document.getElementById('loginPassField')?.value||'';if(!phone||!pass){showToast('Enter phone+pass');return;}try{const uRef=doc(db,'users',phone);const snap=await getDoc(uRef);if(!snap.exists()){showToast('Phone not found! Create account');return;}const d=snap.data();if(d.pass!==pass){showToast('Wrong password!');return;}localStorage.setItem('skylight_phone',phone);currentPhone=phone;currentUser=d;document.getElementById('authBox').style.display='none';document.getElementById('machinesTab').style.display='block';document.getElementById('bottomNav').style.display='flex';document.getElementById('topNav').style.display='flex';updateBal();loadMyOrders();showToast('Welcome '+d.name+' • V31.2 Original Restored! ✅');}catch(e){showToast(e.message);}};
window.registerReal=async()=>{const name=document.getElementById('regName').value.trim();let phone=cleanPhone(document.getElementById('regPhone').value.trim());const pass=document.getElementById('regPass').value.trim();if(!name||!phone||!pass){showToast('Fill all');return;}try{const uRef=doc(db,'users',phone);const snap=await getDoc(uRef);if(snap.exists()){showToast('Phone exists! Login');return;}const myRefCode='SKY-'+Math.random().toString(36).substring(2,8).toUpperCase();await setDoc(uRef,{name,phone,pass,capital:0,profit:0,created:serverTimestamp(),refCode:myRefCode});localStorage.setItem('skylight_phone',phone);currentPhone=phone;currentUser={name,phone,pass,capital:0,profit:0,refCode:myRefCode};document.getElementById('authBox').style.display='none';document.getElementById('machinesTab').style.display='block';document.getElementById('bottomNav').style.display='flex';document.getElementById('topNav').style.display='flex';updateBal();loadMyOrders();showToast('Account created! V31.2 Original!');}catch(e){showToast(e.message);}};
window.showLogin=()=>{document.getElementById('registerBox').style.display='none';document.getElementById('loginBox').style.display='block';};
window.showRegister=()=>{document.getElementById('loginBox').style.display='none';document.getElementById('registerBox').style.display='block';};
</script></body></html>
