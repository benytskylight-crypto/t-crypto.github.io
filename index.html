<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skylight V38.3 Fix</title><style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:20px;text-align:center}.card{background:#1e293b;padding:20px;border-radius:16px;max-width:400px;margin:20px auto}.input{background:#0f172a;border:1px solid #334155;color:#fff;padding:12px;width:100%;border-radius:10px;margin:8px 0}.btn{background:#facc15;color:#000;padding:12px;width:100%;border:none;border-radius:10px;font-weight:800;margin-top:10px}</style>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB48b63LjsJXEHLEn6pZu22L8R-Qs6nowk",authDomain:"skylight-ug.firebaseapp.com",projectId:"skylight-ug",storageBucket:"skylight-ug.firebasestorage.app",messagingSenderId:"264770229240",appId:"1:264770229240:web:53e256b75fba5036bf3c0d"};
const app=initializeApp(cfg);const db=getFirestore(app);window.db=db;window.doc=doc;window.getDoc=getDoc;window.setDoc=setDoc;window.serverTimestamp=serverTimestamp;
window.cleanPhone=(p)=>{let c=(p+'').replace(/\D/g,'');if(c.startsWith('256'))c='0'+c.slice(3);if(c.length==9)c='0'+c;return c;};
window.doLogin=async()=>{let ph=cleanPhone(document.getElementById('ph').value);let pw=document.getElementById('pw').value;if(!ph||!pw){alert('Fill');return;}let snap=await getDoc(doc(db,'users',ph));if(!snap.exists()){alert('Not found - create');return;}if(snap.data().pass!==pw){alert('Wrong pass');return;}localStorage.setItem('skylight_phone',ph);location.href='./?v=38.3FIX';};
window.doReg=async()=>{let name=document.getElementById('name').value;let ph=cleanPhone(document.getElementById('ph').value);let pw=document.getElementById('pw').value;if(!name||!ph||!pw){alert('Fill');return;}let ref=await getDoc(doc(db,'users',ph));if(ref.exists()){alert('Exists - login');return;}await setDoc(doc(db,'users',ph),{name,phone:ph,pass:pw,capital:0,profit:0,refCode:'SKY-'+Math.random().toString(36).slice(2,7).toUpperCase(),created:serverTimestamp()});localStorage.setItem('skylight_phone',ph);alert('Created! Entering...');location.href='./?v=38.3FIX';};
window.clearAll=()=>{localStorage.clear();alert('Cleared - now login');location.reload();};
</script></head><body>
<h2 style="color:#facc15">SKYLIGHT V38.3 EMERGENCY LOGIN</h2>
<p style="font-size:11px;color:#94a3b8">If this works, your main index has bug</p>
<div class="card">
<input id="name" class="input" placeholder="Name (for register)">
<input id="ph" class="input" placeholder="07XXXXXXXX" value="07">
<input id="pw" class="input" type="password" placeholder="Password">
<button class="btn" onclick="doLogin()">LOGIN TEST</button>
<button class="btn" style="background:#0f172a;color:#fff;border:1px solid #334155" onclick="doReg()">CREATE ACCOUNT TEST</button>
<button class="btn" style="background:#ef4444;color:#fff" onclick="clearAll()">CLEAR CACHE</button>
<div id="log" style="margin-top:12px;font-size:11px;color:#facc15"></div>
</div>
</body></html>
