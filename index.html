<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYLIGHT UGANDA V37.2 CLEAN + PROFILE PIC FIX</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0f172a;color:#e2e8f0;font-family:Inter,system-ui}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px;margin-bottom:16px}
.input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px;font-size:13px;margin-bottom:8px}
.btn{width:100%;padding:12px;border-radius:12px;font-weight:900;font-size:13px;cursor:pointer}
.btn-gold{background:#facc15;color:#000}
.profile-pic-premium{width:60px;height:60px;border-radius:50%;background:#1e293b;display:flex;align-items:center;justify-content:center;color:#facc15;font-weight:900;border:2px solid #facc15;position:relative;overflow:hidden;cursor:pointer}
</style>
</head>
<body class="pb-24">
<!-- V37.2 HEADER -->
<div class="bg-slate-900 p-4 sticky top-0 z-20 border-b border-slate-800 flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-yellow-400 rounded-xl flex items-center justify-center font-black text-black text-xl">S</div>
<div><div class="font-bold text-sm">SKYLIGHT UGANDA</div><div class="text-[10px] text-gray-400">6% Daily • VIP 10% • Expiry 30D • Secure • Kampala • LIVE</div></div>
</div>
<span class="bg-green-900 text-green-400 px-2 py-1 rounded-full text-[10px]">LIVE</span>
</div>

<div class="max-w-md mx-auto p-3">
<!-- MONTHLY REWARDS CLEAN -->
<div id="monthlyRewards" class="card">
<h3 class="font-bold">🏆 Monthly Rewards • November 2026</h3>
<div id="adminRewards" class="mt-2"></div>
</div>

<!-- PROFILE SECTION WITH TAP FIX -->
<div id="machinesTab" class="box">
<div class="flex items-center gap-3 mb-4">
<div id="profilePic" class="profile-pic-premium" onclick="document.getElementById('picInput').click()">
<span id="profilePicLetter">S</span><div style="position:absolute;bottom:0;right:0;background:#facc15;color:#000;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px">📷</div>
</div>
<input type="file" id="picInput" accept="image/*" style="display:none" onchange="uploadProfilePic(this)">
<div><div id="profileName" class="font-bold">User</div><div class="text-[11px] text-gray-400">Tap yellow S to change pic • V37.2</div></div>
</div>
</div>

<!-- SETTINGS TAB WITH TAP FIX -->
<div id="settingsTab" class="box card" style="text-align:center">
<div id="settingsPic" style="width:110px;height:110px;font-size:42px;margin:0 auto;position:relative;cursor:pointer;border:3px solid #facc15;border-radius:50%;background:#1e293b;display:flex;align-items:center;justify-content:center;color:#facc15;font-weight:900" onclick="document.getElementById('picInput2').click()">
<span id="settingsPicLetter">S</span>
<div style="position:absolute;bottom:-2px;right:-2px;background:#facc15;color:#000;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid #000">📷</div>
</div>
<input type="file" id="picInput2" accept="image/*" style="display:none" onchange="uploadProfilePic(this)">
<div id="settingsName" style="font-size:18px;margin-top:14px;color:#fff;font-weight:900">User</div>
<div class="small text-gray-400" style="margin-top:4px">Verified • V37.2 • Tap yellow circle to change pic!</div>
<button class="btn btn-gold" style="padding:8px 16px;font-size:11px;width:auto;margin-top:10px" onclick="document.getElementById('picInput2').click()">📷 Change Profile Pic • V37.2 FIXED</button>
</div>

<!-- WITHDRAWALS COLORED -->
<div class="card">
<h3 class="font-bold text-sm">💸 Withdrawals</h3>
<div class="grid grid-cols-3 gap-3 text-center mt-3">
<div class="bg-slate-900 rounded-xl p-2"><p class="small text-gray-400">Pending</p><h4 id="wPending" class="font-bold">0</h4></div>
<div class="bg-slate-900 rounded-xl p-2"><p class="small text-gray-400">Approved</p><h4 id="wApproved" class="font-bold text-green-400">0</h4></div>
<div class="bg-slate-900 rounded-xl p-2"><p class="small text-gray-400">Total</p><h4 id="wTotal" class="font-bold">0</h4></div>
</div>
</div>
</div>

<script>
// V37.2 FIXED — PROFILE PIC CHANGE — TAP TO CHANGE
window.uploadProfilePic = async (input) => {
  const file = input.files[0];
  if(!file){ return; }
  if(file.size > 2*1024*1024){ alert('Max 2MB!'); return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result;
    try{
      const phone = currentPhone || 'SKY-TEST';
      localStorage.setItem('skylight_pic_'+phone, base64);
      document.getElementById('profilePic').innerHTML = `<img src="${base64}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
      document.getElementById('settingsPic').innerHTML = `<img src="${base64}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"><div style="position:absolute;bottom:-2px;right:-2px;background:#facc15;color:#000;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px">📷</div>`;
      alert('✅ Profile pic changed! V37.2 FIXED!');
    }catch(err){ alert(err.message); }
  };
  reader.readAsDataURL(file);
  input.value='';
};
</script>
</body>
</html>
