<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEBUG</title><style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:20px;text-align:center}.card{background:#1e293b;padding:20px;border-radius:16px;max-width:400px;margin:20px auto}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff}button{width:100%;padding:12px;border-radius:8px;border:none;background:#facc15;color:#000;font-weight:800;margin-top:8px}</style></head><body>
<h2 style="color:#facc15">V39 DEBUG - If you see this, cache cleared!</h2>
<div class="card">
<input id="ph" placeholder="07XXXXXXXX">
<input id="pw" type="password" placeholder="Password">
<button onclick="test()">TEST LOGIN</button>
<button onclick="localStorage.clear();alert('Cache cleared');location.reload()" style="background:#ef4444;color:#fff">CLEAR ALL</button>
<div id="log" style="margin-top:10px;font-size:12px;color:#22c55e"></div>
</div>
<script>
function clean(p){let c=(p+'').replace(/\D/g,'');if(c.startsWith('256'))c='0'+c.slice(3);if(c.length==9)c='0'+c;return c;}
async function test(){
 let ph=clean(document.getElementById('ph').value);
 let pw=document.getElementById('pw').value;
 document.getElementById('log').innerHTML='Testing '+ph+'...';
 try{
  const res=await fetch('https://firestore.googleapis.com/v1/projects/skylight-ug/databases/(default)/documents/users/'+ph);
  const data=await res.json();
  document.getElementById('log').innerHTML='Firebase says:<br>'+JSON.stringify(data).substring(0,300);
  if(data.fields && data.fields.pass.stringValue==pw){
   document.getElementById('log').innerHTML+='<br><br>✅ PASSWORD CORRECT! Login works!';
   localStorage.setItem('skylight_phone',ph);
   setTimeout(()=>location.href='./?v=39&t='+Date.now(),1000);
  }else{
   document.getElementById('log').innerHTML+='<br>❌ Wrong pass or not found';
  }
 }catch(e){document.getElementById('log').innerHTML='Error: '+e.message;}
}
</script>
</body></html>
