<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKYLIGHT UGANDA V31.6 FIXED + EXPIRY</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}
body{background:#0b1220;color:#fff;padding-bottom:80px}
.header{background:#1f2937;border-bottom:3px solid #facc15;padding:14px;text-align:center}
.logo{width:50px;height:50px;background:linear-gradient(135deg,#facc15,#eab308);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto}
.h1{color:#facc15;font-weight:900;margin-top:6px}
.sub{font-size:10px;color:#9ca3af}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#1f2937;border:1px solid #333;border-radius:14px;overflow:hidden;position:relative}
.card.vip{border-color:#facc15}
.badge{position:absolute;top:8px;left:8px;background:#22c55e;color:#fff;padding:3px 8px;border-radius:8px;font-size:9px;font-weight:900;z-index:2}
.badge.vip{background:#facc15;color:#000}
.expiry{position:absolute;top:8px;right:8px;background:#0ea5e9;color:#fff;padding:3px 8px;border-radius:8px;font-size:8px;font-weight:900;z-index:3}
.expiry.vip{background:#facc15;color:#000}
.card img{width:100%;height:100px;object-fit:cover;background:#111}
.info{padding:10px}
.price{color:#facc15;font-weight:900}
.daily{color:#22c55e;font-size:10px}
.line{margin-top:6px;background:#0a0a0a;border:1px dashed #facc15;border-radius:8px;padding:5px;font-size:9px;display:flex;justify-content:space-between}
.btn{width:100%;margin-top:8px;padding:10px;background:linear-gradient(135deg,#facc15,#eab308);border:none;border-radius:10px;font-weight:900}
.mybox{margin:12px;padding:12px;background:#1f2937;border-radius:14px;border:1px solid #333}
.row{display:flex;justify-content:space-between;font-size:11px;margin:3px 0}
.progress{height:5px;background:#111;border-radius:10px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:linear-gradient(90deg,#22c55e,#facc15)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#111827;color:#facc15;padding:12px 20px;border-radius:12px;border:2px solid #facc15;display:none;z-index:999}
</style></head><body>
<div class="header"><div class="logo">💡</div><div class="h1">SKYLIGHT UGANDA V31.6 FIXED</div><div class="sub">V31.6: Original + Expiry 30D/20D + Auto-Stop • WORKING • No Black Screen</div></div>
<div id="toast" class="toast"></div>
<div style="padding:12px;text-align:center"><b style="color:#facc15">✅ FIXED - NO MORE BLACK SCREEN!</b><div style="font-size:10px;color:#9ca3af;margin-top:4px">Expiry badges visible • Original design • Auto-Stop active</div></div>
<div id="grid" class="grid"></div>
<div class="mybox"><b style="color:#facc15">📊 MY MACHINES - Test Expiry Countdown</b><div id="myList" style="margin-top:8px;font-size:11px">No machines yet - Click Buy to see countdown!</div></div>

<script>
function toast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
const IMGS=["https://i.ibb.co/NgJcMBYs/M1.jpg","https://i.ibb.co/nMFhSgZ7/M2.jpg","https://i.ibb.co/W4cgPCst/M3.jpg","https://i.ibb.co/JjzPSSsV/Sky-machine.jpg"];
const machines=[];
const cfg=[{c:'A',prices:[2000,5000,10000,20000,40000,80000],rate:0.06,days:30},{c:'M',prices:[3000,7000,15000,30000,60000,120000],rate:0.06,days:30},{c:'L',prices:[5000,10000,20000,40000,80000,150000],rate:0.06,days:30},{c:'U',prices:[8000,15000,30000,60000,120000,200000],rate:0.06,days:30},{c:'Y',prices:[12000,25000,50000,100000,200000,300000],rate:0.06,days:30},{c:'VIP',prices:[20000,40000,80000,150000,300000,500000],rate:0.10,days:20}];
cfg.forEach(c=>{c.prices.forEach((price,i)=>{machines.push({id:c.c+'-MACHINE '+(i+1),cat:c.c,price,daily:Math.round(price*c.rate),rate:c.rate,days:c.days,img:IMGS[i%4]});});});

let purchases=JSON.parse(localStorage.getItem('sky_v31_6')||'[]');

function render(){
  document.getElementById('grid').innerHTML=machines.map(m=>{
    const isVip=m.cat==='VIP';const rateTxt=isVip?'10%':'6%';const max=m.daily*m.days;
    return `<div class="card ${isVip?'vip':''}"><div class="badge ${isVip?'vip':''}">${m.cat} • ${rateTxt}</div><div class="expiry ${isVip?'vip':''}">⏳ ${m.days}D</div><img src="${m.img}" onerror="this.style.background='#222'"><div class="info"><div style="font-weight:800;font-size:12px">${m.id}</div><div class="price">${m.price.toLocaleString()} UGX</div><div class="daily">${rateTxt} = ${m.daily.toLocaleString()}/day • Max ${max.toLocaleString()}</div><div class="line"><span>⏳ Expires: ${m.days} Days</span><span style="color:#22c55e;font-weight:900">${m.days}D • Auto-Stop 🛑</span></div><button class="btn" onclick="buy('${m.id}',${m.price},${m.daily},${m.rate},${m.days})">Buy • ${rateTxt} • ${m.days}D • V31.6 FIXED</button></div></div>`;
  }).join('');
  renderMy();
}

function renderMy(){
  const now=new Date();let html='';
  if(purchases.length===0){document.getElementById('myList').innerHTML='No machines yet - Buy to see <b>25 DAYS LEFT ✅</b> countdown + auto-stop!';return;}
  purchases.forEach(p=>{
    const bought=new Date(p.boughtAt);const elapsed=Math.floor((now-bought)/86400000);
    const remaining=Math.max(0,p.days-elapsed);const pct=Math.min(100,Math.floor((elapsed/p.days)*100));
    const expired=remaining<=0;const active=Math.min(elapsed,p.days);
    const max=p.daily*p.days;const earned=p.daily*active;
    html+=`<div style="border:1px solid ${expired?'#ef4444':'#333'};padding:10px;margin:6px 0;border-radius:10px;background:${expired?'rgba(239,68,68,0.1)':'#111827'};border-left:3px solid ${expired?'#ef4444':'#22c55e'}"><div style="display:flex;justify-content:space-between"><b>${p.id} • ${p.days}D</b><span style="font-size:9px;padding:2px 6px;border-radius:8px;background:${expired?'#ef4444':'#22c55e'};color:#fff;font-weight:900">${expired?'EXPIRED 🛑':remaining+'D LEFT ✅'}</span></div><div class="row"><span>📅 Bought:</span><span>${bought.toLocaleDateString()}</span></div><div class="row"><span>📅 Expires:</span><span>${new Date(bought.getTime()+p.days*86400000).toLocaleDateString()} (${p.days}D)</span></div><div class="row"><span>⏳ Progress:</span><span>Day ${active}/${p.days} (${pct}%)</span></div><div class="row"><span>💵 Earned:</span><span>${earned.toLocaleString()} / ${max.toLocaleString()} UGX</span></div><div class="row"><span>Status:</span><span style="color:${expired?'#ef4444':'#22c55e'};font-weight:900">${expired?'STOPPED 🛑 After '+p.days+'D':'ACTIVE ✅'}</span></div><div class="progress"><div class="fill" style="width:${pct}%;background:${expired?'#ef4444':''}"></div></div>${expired?'<div style="color:#ef4444;font-size:9px;margin-top:4px">🛑 AUTO-STOPPED: Max '+max.toLocaleString()+' after '+p.days+' days. No more profit.</div>':''}</div>`;
  });
  document.getElementById('myList').innerHTML=html;
}

window.buy=(id,price,daily,rate,days)=>{
  purchases.push({id,price,daily,rate,days,boughtAt:new Date().toISOString()});
  localStorage.setItem('sky_v31_6',JSON.stringify(purchases));
  toast(id+' bought! Expires in '+days+' days 🛑');
  render();
};

render();
toast('V31.6 FIXED LOADED! Expiry visible! No black screen!');
</script></body></html>
