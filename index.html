<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SKYLIGHT UGANDA - V31.2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
body {
  background: radial-gradient(ellipse at top, #2a4b9a 0%, #0a2e6b 40%, #08255a 100%);
  min-height:100vh;
  display:flex; justify-content:center;
  overflow-x:hidden;
}
.app {
  width:100%; max-width:430px; min-height:100vh;
  background: radial-gradient(ellipse at 30% 10%, rgba(60,100,200,0.8) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 90%, rgba(30,60,150,0.6) 0%, transparent 40%),
              linear-gradient(180deg, #14367a 0%, #0e2f6e 100%);
  position:relative; padding:20px 20px 100px 20px;
  overflow:hidden;
}
.app::before{
  content:""; position:absolute; inset:0;
  background-image: 
    radial-gradient(2px 2px at 20% 30%, #fff, transparent),
    radial-gradient(2px 2px at 40% 70%, #5aa0ff, transparent),
    radial-gradient(1px 1px at 90% 40%, #ffd700, transparent),
    radial-gradient(2px 2px at 10% 80%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 80% 20%, #ffd700, transparent);
  background-repeat:repeat; background-size:200px 200px;
  opacity:0.6; pointer-events:none;
}
/* Bulb */
.bulb-wrap { display:flex; flex-direction:column; align-items:center; margin-top:15px; position:relative; z-index:2; }
.bulb {
  width:220px; height:280px; position:relative;
  filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4));
}
.bulb img { width:100%; height:100%; object-fit:contain; }
.glow-ring {
  position:absolute; top:5%; left:50%; transform:translateX(-50%);
  width:260px; height:260px; border-radius:50%;
  background: radial-gradient(circle, rgba(255,215,0,0.25) 0%, transparent 70%);
  filter: blur(2px);
}
.sparkles {
  position:absolute; inset:-20px;
  background: radial-gradient(circle at 30% 30%, rgba(255,215,0,0.8) 0 1px, transparent 2px),
              radial-gradient(circle at 70% 20%, rgba(255,255,255,0.8) 0 1px, transparent 2px);
  animation: twinkle 3s infinite alternate;
}
@keyframes twinkle { 0%{opacity:0.5} 100%{opacity:1} }

.title {
  margin-top:10px; font-family:'Playfair Display', serif;
  font-size:32px; letter-spacing:2px; font-weight:700;
  background: linear-gradient(180deg, #ffeaa0 0%, #d4af37 50%, #aa8530 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  text-align:center; text-shadow:0 2px 10px rgba(212,175,55,0.4);
  z-index:2; position:relative;
}
/* Inputs */
.form { margin-top:25px; display:flex; flex-direction:column; gap:14px; position:relative; z-index:2; }
.pill {
  background:#fff; border-radius:50px; height:58px;
  display:flex; align-items:center; padding:0 18px;
  box-shadow:0 8px 20px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.8);
  border:1px solid rgba(255,255,255,0.8);
}
.pill .icon { width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.flag-icon {
  background: url('https://flagcdn.com/w80/ug.png') center/cover; border:2px solid #fff;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
}
.pill input { flex:1; border:none; outline:none; font-size:15px; margin-left:12px; color:#333; background:transparent; }
.pill input::placeholder { color:#888; }

.btn-gold {
  height:58px; border-radius:50px; border:none;
  background: linear-gradient(180deg, #f6d78a 0%, #d4af37 20%, #b8941f 50%, #d4af37 80%, #e8c765 100%);
  color:#6b4a00; font-size:20px; font-weight:700; letter-spacing:3px;
  box-shadow:0 6px 0 #8a6d1a, 0 12px 20px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.8);
  text-shadow:0 1px 0 rgba(255,255,255,0.6);
  cursor:pointer; position:relative;
}
.btn-gold:active { transform:translateY(4px); box-shadow:0 2px 0 #8a6d1a, 0 6px 10px rgba(0,0,0,0.3); }

.btn-green {
  height:58px; border-radius:50px; border:none;
  background: linear-gradient(180deg, #3da75a 0%, #2e8b4a 100%);
  color:#fff; font-size:16px; font-weight:600; letter-spacing:1px;
  box-shadow:0 6px 18px rgba(0,0,0,0.25);
  cursor:pointer;
}

.trusted { text-align:center; color:rgba(255,255,255,0.9); font-size:13px; margin:22px 0 14px 0; letter-spacing:0.5px; position:relative; z-index:2; }
.grid {
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; position:relative; z-index:2;
}
.card {
  background:#fff; border-radius:16px; padding:14px 6px 10px 6px; text-align:center;
  box-shadow:0 8px 16px rgba(0,0,0,0.15);
}
.card .gicon { font-size:26px; color:#c9a227; margin-bottom:6px; }
.card p { font-size:11px; font-weight:600; color:#222; line-height:1.2; }

/* Bottom Nav */
.bottom-nav {
  position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
  width:calc(100% - 24px); max-width:400px;
  background:#fff; border-radius:50px; height:68px;
  display:flex; justify-content:space-around; align-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.3); z-index:10;
}
.nav-item { display:flex; flex-direction:column; align-items:center; font-size:10px; font-weight:600; color:#888; gap:2px; }
.nav-item.active { color:#b8941f; }
.nav-item .nicon { font-size:22px; }
</style>
</head>
<body>
<div class="app">
  <div class="bulb-wrap">
    <div class="glow-ring"></div>
    <div class="bulb">
      <!-- Replace with your bulb PNG if you have -->
      <div style="width:100%;height:100%;background:radial-gradient(circle at center, #fff8a0 0%, #ffd700 20%, transparent 60%);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;display:flex;align-items:center;justify-content:center;font-size:90px;box-shadow:0 0 60px #ffd700, inset 0 0 40px #fff;">💡</div>
      <div class="sparkles"></div>
    </div>
    <div class="title">SKYLIGHT UGANDA</div>
  </div>

  <div class="form">
    <div class="pill">
      <div class="icon flag-icon"></div>
      <input type="tel" placeholder="+256 7XX XXX XXX" value="+256 7XX XXX XXX">
    </div>
    <div class="pill">
      <div class="icon">🔒</div>
      <input type="password" placeholder="••••••••" value="••••••••">
    </div>
    <div class="pill">
      <div class="icon">🏷️</div>
      <input type="text" placeholder="Referral code (Optional)">
    </div>

    <button class="btn-gold" onclick="handleLogin()">LOGIN</button>
    <button class="btn-green" onclick="handleRegister()">REGISTER</button>
  </div>

  <div class="trusted">Trusted & Secure</div>
  <div class="grid">
    <div class="card"><div class="gicon">🛡️</div><p>Secure Payment</p></div>
    <div class="card"><div class="gicon">✅</div><p>Verified</p></div>
    <div class="card"><div class="gicon">⚡</div><p>Fast Withdraw</p></div>
    <div class="card"><div class="gicon">🎧</div><p>24/7 Support</p></div>
    <div class="card"><div class="gicon">🔰</div><p>SSL Encrypted</p></div>
    <div class="card"><div class="gicon">🪪</div><p>KYC Protected</p></div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active"><div class="nicon">🏠</div>HOME</div>
  <div class="nav-item"><div class="nicon">💬</div>CHAT</div>
  <div class="nav-item"><div class="nicon">🎁</div>REWARDS</div>
  <div class="nav-item"><div class="nicon">👛</div>WITHDRAW</div>
  <div class="nav-item"><div class="nicon">👤</div>PROFILE</div>
</div>

<script>
// V31.2 - Full Logic
const API_BASE = "https://your-api.skylight.ug/api"; // change to your backend

function handleLogin(){
  const phone = document.querySelector('input[type=tel]').value;
  const pass = document.querySelector('input[type=password]').value;
  if(!phone || !pass){ alert('Enter phone and password'); return; }
  console.log('V31.2 LOGIN', phone);
  // fetch(API_BASE+'/login', {method:'POST', body:JSON.stringify({phone, password:pass})})
  alert('V31.2 Login -> '+phone);
}
function handleRegister(){
  const phone = document.querySelector('input[type=tel]').value;
  const referral = document.querySelector('input[type=text]').value;
  console.log('V31.2 REGISTER', phone, referral);
  alert('V31.2 Register -> '+phone);
}

// Add sparkle particles dynamically for premium feel
setInterval(()=>{
  const dot = document.createElement('div');
  dot.style.position='absolute';
  dot.style.left=Math.random()*100+'%';
  dot.style.top=Math.random()*100+'%';
  dot.style.width='2px'; dot.style.height='2px';
  dot.style.background='#ffd700'; dot.style.borderRadius='50%';
  dot.style.boxShadow='0 0 6px #ffd700';
  dot.style.opacity='0.8';
  document.querySelector('.app').appendChild(dot);
  setTimeout(()=>dot.remove(), 3000);
}, 150);
</script>
</body>
</html>
