<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKYLIGHT AI COMPANY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070d1f;color:white;font-family:Arial;padding-bottom:95px}
.top{display:flex;justify-content:space-between;padding:14px;background:#0a1430;position:sticky;top:0;z-index:10}
.top b{color:#2ecfff;font-size:15px}
.top span{color:#3dd68c;font-size:11px}
.tabs{display:flex;justify-content:space-around;padding:10px;background:#0a1430;border-bottom:1px solid #1a2a50;position:sticky;top:44px;z-index:10}
.tabs div{color:#8aa0c8;font-size:13px;text-align:center;padding:6px;cursor:pointer;font-weight:bold}
.tabs .active{color:#2ecfff;border-bottom:2px solid #2ecfff}
.card{display:flex;margin:10px;border-radius:16px;padding:10px;align-items:center}
.card.M{background:#122040;border:1px solid #1ec8ff}
.card.Y{background:#2a1010;border:1px solid #ff6a3d}
.card.U{background:#251040;border:1px solid #b86bff}
.card.A{background:#102a1a;border:1px solid #3dd68c}
.card.VIP{background:#1a1500;border:1px solid #ffcc00}
.imgbox{position:relative;width:85px;height:85px;flex-shrink:0}
.imgbox img{width:100%;height:100%;border-radius:12px;background:#000;object-fit:cover}
.badge{position:absolute;top:-6px;left:-6px;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:bold}
.card.M .badge{background:#2ecfff;color:#000}
.card.Y .badge{background:#ff6a3d;color:white}
.card.U .badge{background:#b86bff;color:white}
.card.A .badge{background:#3dd68c;color:#000}
.card.VIP .badge{background:#ffcc00;color:#000}
.info{margin-left:12px;flex:1}
.info h4{font-size:13px}
.card.M h4{color:#2ecfff}
.card.Y h4{color:#ff8a65}
.card.U h4{color:#d8a0ff}
.card.A h4{color:#3dd68c}
.card.VIP h4{color:#ffcc00}
.info p{font-size:11px;margin:4px 0;color:#cbd6ee}
.btns{display:flex;gap:8px;margin-top:6px}
.buy{border:none;padding:6px 14px;border-radius:8px;font-weight:bold;color:white;font-size:12px;cursor:pointer}
.card.M .buy{background:#2ecfff}
.card.Y .buy{background:#ff6a3d}
.card.U .buy{background:#c084ff}
.card.A .buy{background:#15b85f}
.card.VIP .buy{background:#ffcc00;color:#000}
.recv{background:#15b85f;color:white;border:none;padding:6px 14px;border-radius:8px;font-weight:bold;font-size:12px}
.card.VIP .recv{background:#ffaa00;color:#000}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#0a1430;padding:8px 0 12px;border-top:1px solid #1a2a50;z-index:20}
.nav div{text-align:center;font-size:10px;color:#8aa0c8;cursor:pointer}
.nav .active{color:#2ecfff}
.lock{font-size:10px}
</style>
</head>
<body>
<div class="top"><b>SKYLIGHT AI COMPANY</b><span>● VIP 17% + INVITE LOCK</span></div>
<div class="tabs">
<div class="active" onclick="filterCat('ALL',this)">All<br>36</div>
<div onclick="filterCat('A',this)">A(6)</div>
<div onclick="filterCat('M',this)">M(6)</div>
<div onclick="filterCat('U',this)">U/L/Y(18)</div>
<div onclick="filterCat('VIP',this)">VIP(6) 🔒</div>
</div>
<div id="list"></div>
<div class="nav">
<div class="active">🏠<br>Home</div>
<div>📟<br>Machines</div>
<div onclick="location.href='deposit.html'">💰<br>Wallet</div>
<div>👥<br>Group</div>
<div>📜<br>Rules</div>
<div>⚙️<br>Set</div>
</div>
<script>
let data=[
{M:"M1",T:"M",P:2000,D:120,Tot:3600,I:"m.png"},
{M:"M2",T:"M",P:5000,D:300,Tot:9000,I:"m.png"},
{M:"M3",T:"M",P:10000,D:600,Tot:18000,I:"m.png"},
{M:"M4",T:"M",P:20000,D:1200,Tot:36000,I:"m.png"},
{M:"M5",T:"M",P:40000,D:2400,Tot:72000,I:"m.png"},
{M:"M6",T:"M",P:80000,D:4800,Tot:144000,I:"m.png"},
{M:"Y1",T:"Y",P:2500,D:150,Tot:4500,I:"y.png"},
{M:"Y2",T:"Y",P:7000,D:420,Tot:12600,I:"y.png"},
{M:"Y3",T:"Y",P:18000,D:1080,Tot:32400,I:"y.png"},
{M:"Y4",T:"Y",P:35000,D:2100,Tot:63000,I:"y.png"},
{M:"Y5",T:"Y",P:70000,D:4200,Tot:126000,I:"y.png"},
{M:"Y6",T:"Y",P:150000,D:9000,Tot:270000,I:"y.png"},
{M:"U1",T:"U",P:4000,D:240,Tot:7200,I:"u.png"},
{M:"U2",T:"U",P:8000,D:480,Tot:14400,I:"u.png"},
{M:"U3",T:"U",P:15000,D:900,Tot:27000,I:"u.png"},
{M:"U4",T:"U",P:30000,D:1800,Tot:54000,I:"u.png"},
{M:"U5",T:"U",P:60000,D:3600,Tot:108000,I:"u.png"},
{M:"U6",T:"U",P:120000,D:7200,Tot:216000,I:"u.png"},
{M:"L1",T:"U",P:5000,D:300,Tot:9000,I:"u.png"},
{M:"L2",T:"U",P:10000,D:600,Tot:18000,I:"u.png"},
{M:"L3",T:"U",P:20000,D:1200,Tot:36000,I:"u.png"},
{M:"L4",T:"U",P:40000,D:2400,Tot:72000,I:"u.png"},
{M:"L5",T:"U",P:80000,D:4800,Tot:144000,I:"u.png"},
{M:"L6",T:"U",P:160000,D:9600,Tot:288000,I:"u.png"},
{M:"A1",T:"A",P:3000,D:180,Tot:5400,I:"m.png"},
{M:"A2",T:"A",P:6000,D:360,Tot:10800,I:"m.png"},
{M:"A3",T:"A",P:12000,D:720,Tot:21600,I:"m.png"},
{M:"A4",T:"A",P:25000,D:1500,Tot:45000,I:"m.png"},
{M:"A5",T:"A",P:50000,D:3000,Tot:90000,I:"m.png"},
{M:"A6",T:"A",P:100000,D:6000,Tot:180000,I:"m.png"},
{M:"VIP1",T:"VIP",P:200000,D:15000,Tot:450000,I:"vip.png"},
{M:"VIP2",T:"VIP",P:400000,D:32000,Tot:960000,I:"vip.png"},
{M:"VIP3",T:"VIP",P:800000,D:68000,Tot:2040000,I:"vip.png"},
{M:"VIP4",T:"VIP",P:1500000,D:135000,Tot:4050000,I:"vip.png"},
{M:"VIP5",T:"VIP",P:3000000,D:285000,Tot:8550000,I:"vip.png"},
{M:"VIP6",T:"VIP",P:5000000,D:500000,Tot:15000000,I:"vip.png"},
];
function render(arr){
 let h="";
 arr.forEach(x=>{
  let icon = x.T=='M'?"❄️":x.T=='Y'?"🔥":x.T=='U'?"🔮":x.T=='A'?"💎":"👑";
  let lock = x.T=='VIP'?' 🔒':'';
  h+=`<div class="card ${x.T}"><div class="imgbox"><div class="badge">${x.M}</div><img src="${x.I}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/4712/4712009.png'"></div><div class="info"><h4>${x.M} SKY 6% ${icon}${lock}</h4><p>Price:${x.P.toLocaleString()} Daily:${x.D.toLocaleString()} Total:${x.Tot.toLocaleString()}</p><div class="btns"><button class="buy" onclick="location.href='deposit.html?m=${x.M}&price=${x.P}'">Buy</button><button class="recv">Receive</button></div></div></div>`;
 });
 document.getElementById("list").innerHTML=h;
}
render(data);
function filterCat(type,el){
 document.querySelectorAll(".tabs div").forEach(d=>d.classList.remove("active"));
 el.classList.add("active");
 if(type=='ALL') render(data);
 else if(type=='U') render(data.filter(x=>x.T=='Y'||x.T=='U'));
 else render(data.filter(x=>x.T==type));
}
</script>
</body>
</html>
