<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skylight Crypto</title>
<style>
body{background:#0b0f1a;color:#fff;font-family:Arial;margin:0;padding:10px}
.tabs{display:flex;gap:5px;margin:10px 0;overflow:auto}
.tab{padding:8px 12px;background:#1a2332;border-radius:20px;cursor:pointer;white-space:nowrap}
.tab.active{background:#7c3aed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#151e2f;border-radius:12px;padding:8px;text-align:center;border:1px solid #2a3a5a}
.card img{width:100%;height:80px;object-fit:contain;background:#0f172a;border-radius:8px}
.card.vip{border:1px solid gold;box-shadow:0 0 10px gold}
.btn{width:100%;background:#7c3aed;color:#fff;border:none;padding:8px;border-radius:8px;margin-top:5px}
</style></head><body>
<h2 style="text-align:center">⚡ Skylight Mining</h2>
<div class="tabs">
<div class="tab active" onclick="show('all',this)">All (36)</div>
<div class="tab" onclick="show('m',this)">M (6)</div>
<div class="tab" onclick="show('y',this)">Y (6)</div>
<div class="tab" onclick="show('u',this)">U/L/Y (18)</div>
<div class="tab" onclick="show('vip',this)">VIP (6)</div>
</div>
<div id="grid" class="grid"></div>
<script>
const machines=[
...Array(6).fill(0).map((_,i)=>({id:`M${i+1}`,cat:'m',name:`Miner M${i+1}`,img:'m.png.jpg',price:10+i*5})),
...Array(6).fill(0).map((_,i)=>({id:`Y${i+1}`,cat:'y',name:`Tower Y${i+1}`,img:'y.png.jpg',price:20+i*5})),
...Array(18).fill(0).map((_,i)=>({id:`U${i+1}`,cat:'u',name:`Unit U${i+1}`,img:'u.png.jpg',price:30+i*2})),
...Array(6).fill(0).map((_,i)=>({id:`VIP${i+1}`,cat:'vip',name:`VIP Miner ${i+1}`,img:'png.vip.jpg',price:100+i*50})),
];
function render(list){
 document.getElementById('grid').innerHTML=list.map(m=>`
  <div class="card ${m.cat=='vip'?'vip':''}">
   <img src="${m.img}" onerror="this.src='https://via.placeholder.com/150?text=${m.id}'">
   <div style="font-size:12px;margin:5px 0">${m.name} ${m.cat=='vip'?'👑':''}</div>
   <div style="color:#fbbf24">$${m.price}</div>
   <button class="btn" onclick="alert('Buy ${m.id} - $${m.price}')">Buy</button>
  </div>`).join('');
}
function show(cat,el){
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active');
 if(cat=='all') render(machines); else render(machines.filter(x=>x.cat==cat));
}
render(machines);
</script>
</body></html>
