<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SKYLIGHT UGANDA V31.3 FINAL</title><link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a2e6b">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#0a2e6b;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;background:linear-gradient(180deg,#14367a 0%,#0a2e6b 100%);padding:20px 20px 100px 20px}
.bulb-wrap{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.bulb-img{width:170px;filter:drop-shadow(0 0 30px #ffd700);animation:float 3s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.title{margin-top:8px;font-size:30px;font-weight:800;color:#d4af37;text-align:center}
.form{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.pill{background:#fff;border-radius:50px;height:56px;display:flex;align-items:center;padding:0 16px}
.pill input{flex:1;border:none;outline:none;margin-left:10px}
.btn-gold{height:56px;border-radius:50px;border:none;background:linear-gradient(180deg,#f6d78a,#d4af37);color:#5a4100;font-weight:800;letter-spacing:2px;box-shadow:0 5px 0 #8a6d1a;cursor:pointer}
.btn-green{height:56px;border-radius:50px;border:none;background:#2e8b4a;color:#fff;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:20px}
.card{background:#fff;border-radius:14px;padding:12px 4px;text-align:center;font-size:10px;font-weight:700}
.bottom-nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:400px;background:#fff;border-radius:50px;height:64px;display:flex;justify-content:space-around;align-items:center}
.nav-item{font-size:9px;color:#888;text-align:center}
.nav-item.active{color:#b8941f}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:30px;font-size:12px;z-index:9999}
</style>
</head>
<body>
<div class="app">
<div class="bulb-wrap">
<img src="./bulb.png" class="bulb-img">
<div class="title">SKYLIGHT UGANDA</div>
</div>
<div class="form">
<div class="pill">🇺🇬<input id="phone" placeholder="+256 7XX XXX XXX"></div>
<div class="pill">🔒<input id="password" type="password" placeholder="Enter password"></div>
<div class="pill">🏷️<input id="ref" placeholder="Referral code (Optional)"></div>
<button id="loginBtn" class="btn-gold" onclick="handleLogin()">LOGIN</button>
<button class="btn-green" onclick="handleRegister()">REGISTER</button>
</div>
<div style="text-align:center;color:#fff;font-size:12px;margin:18px 0 10px 0">Trusted & Secure</div>
<div class="grid">
<div class="card">🛡️<br>Secure Payment</div><div class="card">✅<br>Verified</div><div class="card">⚡<br>Fast Withdraw</div>
<div class="card">🎧<br>24/7 Support</div><div class="card">🔰<br>SSL Encrypted</div><div class="card">🪪<br>KYC Protected</div>
</div>
</div>
<div class="bottom-nav"><div class="nav-item active">🏠<br>HOME</div><div class="nav-item">💬<br>CHAT</div><div class="nav-item">🎁<br>REWARDS</div><div class="nav-item">👛<br>WITHDRAW</div><div class="nav-item">👤<br>PROFILE</div></div>
<script>
function showToast(m,e=false){let o=document.getElementById('toast');if(o)o.remove();let t=document.createElement('div');t.id='toast';t.textContent=m;t.style.background=e?'#c0392b':'#111';document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
async function handleLogin(){let p=document.getElementById('phone').value.trim(),pw=document.getElementById('password').value.trim(),b=document.getElementById('loginBtn');if(!p||!pw){showToast('Enter phone and password',true);return}let orig=b.innerHTML;b.innerHTML='LOGGING IN...';b.disabled=true;try{await new Promise(r=>setTimeout(r,1000));localStorage.setItem('skylight_phone',p);localStorage.setItem('skylight_token','v31_3_'+Date.now());showToast('Login success');setTimeout(()=>location.href='./dashboard.html',700)}catch(e){showToast('Login failed',true)}finally{b.innerHTML=orig;b.disabled=false}}
function handleRegister(){let p=document.getElementById('phone').value,r=document.getElementById('ref').value;location.href=`./register.html?phone=${encodeURIComponent(p)}&ref=${encodeURIComponent(r)}`}
</script>
</body>
</html>
