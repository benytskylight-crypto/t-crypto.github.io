<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - SKYLIGHT UGANDA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#0a2e6b;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;background:linear-gradient(180deg,#14367a,#0a2e6b);padding:20px 20px 90px 20px;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.top h2{color:#d4af37;font-size:22px}
.card{background:#fff;color:#111;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 20px rgba(0,0,0,0.2)}
.balance h3{color:#666;font-size:13px}
.balance h1{font-size:32px;margin:5px 0;color:#0a2e6b}
.btn{width:100%;height:52px;border-radius:50px;border:none;background:linear-gradient(180deg,#f6d78a,#d4af37);color:#5a4100;font-weight:800;cursor:pointer;margin-top:12px}
.btn-green{width:100%;height:52px;border-radius:50px;border:none;background:#2e8b4a;color:#fff;font-weight:700;cursor:pointer;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.mini{background:#fff;color:#111;border-radius:14px;padding:16px;text-align:center}
.bottom-nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:400px;background:#fff;border-radius:50px;height:64px;display:flex;justify-content:space-around;align-items:center}
.nav-item{font-size:9px;color:#888;text-align:center}
.nav-item.active{color:#b8941f}
</style>
</head>
<body>
<div class="app">
<div class="top"><h2>SKYLIGHT</h2><div style="background:#fff;color:#111;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700" id="phoneTag">+256...</div></div>

<div class="card balance">
<h3>Total Balance</h3>
<h1>UGX 0</h1>
<p style="font-size:12px;color:#666">Welcome to SKYLIGHT UGANDA V31.3<br>Start investing to earn daily</p>
<button class="btn" onclick="alert('Invest coming soon')">INVEST NOW</button>
</div>

<div class="grid2">
<div class="mini"><div style="font-size:28px">💰</div><p style="font-size:11px;font-weight:700;margin-top:6px">Daily Earnings<br>UGX 0</p></div>
<div class="mini"><div style="font-size:28px">👥</div><p style="font-size:11px;font-weight:700;margin-top:6px">My Team<br>0 Members</p></div>
</div>

<div class="card">
<p style="font-size:13px">✅ <b>Login Success!</b><br>V31.3 No alert popup. Bulb working.</p>
</div>

<button class="btn-green" onclick="localStorage.clear();location.href='./index.html'">LOGOUT</button>
</div>

<div class="bottom-nav">
<div class="nav-item active">🏠<br>HOME</div><div class="nav-item">💬<br>CHAT</div><div class="nav-item">🎁<br>REWARDS</div><div class="nav-item">👛<br>WITHDRAW</div><div class="nav-item">👤<br>PROFILE</div>
</div>

<script>
let phone=localStorage.getItem('skylight_phone')||'+256...';
let token=localStorage.getItem('skylight_token');
if(!token){ location.href='./index.html'; }
document.getElementById('phoneTag').textContent=phone;
</script>
</body>
</html>
