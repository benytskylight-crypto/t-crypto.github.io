<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Register - SKYLIGHT UGANDA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#0a2e6b;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;background:linear-gradient(180deg,#14367a,#0a2e6b);padding:20px}
.title{text-align:center;color:#d4af37;font-size:26px;font-weight:800;margin:20px 0}
.pill{background:#fff;border-radius:50px;height:56px;display:flex;align-items:center;padding:0 16px;margin:12px 0}
.pill input{flex:1;border:none;outline:none;margin-left:10px}
.btn{width:100%;height:56px;border-radius:50px;border:none;background:linear-gradient(180deg,#f6d78a,#d4af37);color:#5a4100;font-weight:800;margin-top:10px;cursor:pointer}
.btn2{width:100%;height:56px;border-radius:50px;border:none;background:#fff;color:#111;font-weight:700;margin-top:10px;cursor:pointer}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:30px;font-size:12px;z-index:9999}
</style>
</head>
<body>
<div class="app">
<div class="title">Create Account</div>
<div class="pill">🇺🇬<input id="r_phone" placeholder="+256 7XX XXX XXX"></div>
<div class="pill">🔒<input id="r_pass" type="password" placeholder="Create password"></div>
<div class="pill">🔒<input id="r_pass2" type="password" placeholder="Confirm password"></div>
<div class="pill">🏷️<input id="r_ref" placeholder="Referral code (Optional)"></div>
<button class="btn" onclick="doRegister()">CREATE ACCOUNT</button>
<button class="btn2" onclick="location.href='./index.html'">BACK TO LOGIN</button>
</div>
<script>
let params=new URLSearchParams(location.search);
document.getElementById('r_phone').value=params.get('phone')||'';
document.getElementById('r_ref').value=params.get('ref')||'';
function showToast(m){let t=document.createElement('div');t.id='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function doRegister(){
let p=document.getElementById('r_phone').value.trim();
let pw=document.getElementById('r_pass').value.trim();
let pw2=document.getElementById('r_pass2').value.trim();
if(!p||!pw){showToast('Fill all fields');return}
if(pw!==pw2){showToast('Passwords not match');return}
localStorage.setItem('skylight_phone',p);
localStorage.setItem('skylight_token','v31_3_'+Date.now());
showToast('Account created! Go to login');
setTimeout(()=>{location.href='./index.html'},1200);
}
</script>
</body>
</html>
